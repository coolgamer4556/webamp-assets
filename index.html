<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webamp - Asset Music Player</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #001f3f; 
            overflow: hidden; 
        }
        #app { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>
    <script src="https://unpkg.com/butterchurn@2.6.7/lib/butterchurn.min.js"></script>
    <script src="https://unpkg.com/butterchurn-presets@2.4.7/lib/butterchurnPresets.min.js"></script>

    <script>
        const Webamp = window.Webamp;

        // Base URL for your music folder on jsDelivr
        const BASE_URL = "https://cdn.jsdelivr.net/gh/coolgamer4556/webamp-assets@main/music/";

        const initialTracks = [
            {
                metaData: { artist: "Rascal Flatts", title: "Life is a Highway" },
                url: `${BASE_URL}01.%20Life%20is%20a%20Highway.m4a`
            },
            {
                metaData: { artist: "Smash Mouth", title: "All Star" },
                url: `${BASE_URL}06%20-%20Smash%20Mouth%20-%20All%20Star.mp3`
            },
            {
                metaData: { artist: "Toby Fox", title: "Megalovania" },
                url: `${BASE_URL}Megalovania.mp3`
            },
            {
                metaData: { artist: "The Living Tombstone", title: "My Ordinary Life" },
                url: `${BASE_URL}The%20Living%20Tombstone%20-%20My%20Ordinary%20Life.mp3`
            },
            {
                metaData: { artist: "Mareux", title: "The Perfect Girl" },
                url: `${BASE_URL}The_Perfect_Girl.wav`
            }
        ];

        const initialSkin = {
            url: "https://cdn.jsdelivr.net/gh/coolgamer4556/webamp-assets@main/Winamp5_Classified_v5.5.wsz"
        };

        const webamp = new Webamp({
            initialTracks: initialTracks,
            initialSkin: initialSkin,
            __butterchurnOptions: {
                importButterchurn: () => Promise.resolve(window.butterchurn),
                getPresets: () => {
                    const presets = window.butterchurnPresets.getPresets();
                    return Object.keys(presets).map((name) => {
                        return { name, butterchurnPresetObject: presets[name] };
                    });
                },
                butterchurnOpen: true 
            },
            zIndex: 99999
        });

        if (!Webamp.browserIsSupported()) {
            document.getElementById("app").innerText = "Webamp is not supported";
        } else {
            webamp.renderWhenReady(document.getElementById("app")).then(() => {
                
                // 1. Enable Double Size Mode
                webamp.store.dispatch({ 
                    type: 'SET_DOUBLE_SIZE_MODE', 
                    doubleSizeMode: true 
                });

                // 2. Set Milkdrop visualizer size
                webamp.store.dispatch({
                    type: 'UPDATE_WINDOW_PROPS',
                    windowId: 'milkdrop',
                    props: { size: [4, 3] } 
                });

                // 3. Position Windows
                webamp.store.dispatch({
                    type: 'UPDATE_WINDOW_PROPS',
                    windowId: 'main',
                    props: { xy: [0, 0] }
                });

                webamp.store.dispatch({
                    type: 'UPDATE_WINDOW_PROPS',
                    windowId: 'milkdrop',
                    props: { xy: [0, 116] } 
                });
            });
        }
    </script>
</body>
</html>
