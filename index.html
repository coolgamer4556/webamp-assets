<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webamp - Large Fixed</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #001f3f; overflow: hidden; 
        }
        #app { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>
    <script src="https://unpkg.com/butterchurn@2.6.7/lib/butterchurn.min.js"></script>
    <script src="https://unpkg.com/butterchurn-presets@2.4.7/lib/butterchurnPresets.min.js"></script>

    <script>
        const Webamp = window.Webamp;

        // Base URL for your music folder
        const MUSIC_BASE = "https://cdn.jsdelivr.net/gh/coolgamer4556/webamp-assets@main/music/";

        // LIST YOUR FILENAMES HERE
        // Replace 'filename.mp3' with the actual names of your files in GitHub
        const myMusicFiles = [
            "filename1.mp3",
            "filename2.wav",
            "filename3.ma4",
            // ... add all 23 filenames here
        ];

        // This automatically formats the filenames into Webamp tracks
        const initialTracks = [
            {
                metaData: { artist: "Choker", title: "El Dorado" },
                url: "https://cdn.jsdelivr.net/gh/coolgamer4556/webamp-assets@main/1_05%20-%20El%20Dorado.mp3"
            },
            {
                metaData: { artist: "Jonn Hart", title: "Who Booty" },
                url: "https://cdn.jsdelivr.net/gh/coolgamer4556/webamp-assets@main/Jonn%20Hart%20%E2%80%93%20Who%20Booty.mp3"
            },
            ...myMusicFiles.map(filename => ({
                metaData: { 
                    artist: "My Music", 
                    title: filename.replace(/\.[^/.]+$/, "") // This removes the extension (like .mp3) from the title
                },
                url: MUSIC_BASE + encodeURIComponent(filename)
            }))
        ];

        const initialSkin = {
            url: "https://cdn.jsdelivr.net/gh/coolgamer4556/webamp-assets@main/Winamp5_Classified_v5.5.wsz"
        };

        const webamp = new Webamp({
            initialTracks: initialTracks,
            initialSkin: initialSkin,
            __butterchurnOptions: {
                importButterchurn: () => Promise.resolve(window.butterchurn),
                getPresets: () => {
                    const presets = window.butterchurnPresets.getPresets();
                    return Object.keys(presets).map((name) => ({ name, butterchurnPresetObject: presets[name] }));
                },
                butterchurnOpen: true 
            },
            zIndex: 99999
        });

        if (Webamp.browserIsSupported()) {
            webamp.renderWhenReady(document.getElementById("app")).then(() => {
                webamp.store.dispatch({ type: 'SET_DOUBLE_SIZE_MODE', doubleSizeMode: true });
                webamp.store.dispatch({ type: 'UPDATE_WINDOW_PROPS', windowId: 'milkdrop', props: { size: [4, 3], xy: [0, 116] } });
                webamp.store.dispatch({ type: 'UPDATE_WINDOW_PROPS', windowId: 'main', props: { xy: [0, 0] } });
            });
        }
    </script>
</body>
</html>
