<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webamp Player - Large</title>
    <style>
        /* Keep it simple so it doesn't conflict with Hotglue's container */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #001f3f; 
        }
        #app { 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>
    <script src="https://unpkg.com/butterchurn@2.6.7/lib/butterchurn.min.js"></script>
    <script src="https://unpkg.com/butterchurn-presets@2.4.7/lib/butterchurnPresets.min.js"></script>

    <script>
        const Webamp = window.Webamp;

        const initialTracks = [
            {
                metaData: { artist: "Choker", title: "El Dorado" },
                url: "https://cdn.jsdelivr.net/gh/coolgamer4556/webamp-assets@main/1_05%20-%20El%20Dorado.mp3"
            },
            {
                metaData: { artist: "Jonn Hart", title: "Who Booty" },
                url: "https://cdn.jsdelivr.net/gh/coolgamer4556/webamp-assets@main/Jonn%20Hart%20%E2%80%93%20Who%20Booty.mp3"
            }
        ];

        const initialSkin = {
            url: "https://cdn.jsdelivr.net/gh/coolgamer4556/webamp-assets@main/Winamp5_Classified_v5.5.wsz"
        };

        const webamp = new Webamp({
            initialTracks: initialTracks,
            initialSkin: initialSkin,
            __butterchurnOptions: {
                importButterchurn: () => Promise.resolve(window.butterchurn),
                getPresets: () => {
                    const presets = window.butterchurnPresets.getPresets();
                    return Object.keys(presets).map((name) => {
                        return { name, butterchurnPresetObject: presets[name] };
                    });
                },
                butterchurnOpen: true 
            },
            zIndex: 99999
        });

        if (!Webamp.browserIsSupported()) {
            document.getElementById("app").innerText = "Webamp is not supported in this browser";
        } else {
            // SAFE LOADING METHOD:
            // We use .then() to wait until the player is 100% visible on screen 
            // before we try to change its size settings.
            webamp.renderWhenReady(document.getElementById("app")).then(() => {
                
                // 1. Enable Double Size Mode
                webamp.store.dispatch({ 
                    type: 'SET_DOUBLE_SIZE_MODE', 
                    doubleSizeMode: true 
                });

                // 2. Make the Milkdrop (visualizer) window 2 blocks wide and 2 blocks tall
                webamp.store.dispatch({
                    type: 'UPDATE_WINDOW_PROPS',
                    windowId: 'milkdrop',
                    props: { size: [2, 2] } 
                });

                // 3. Bring the visualizer to the front
                webamp.store.dispatch({ 
                    type: 'SET_FOCUS', 
                    windowId: 'milkdrop' 
                });
                
            }).catch(err => {
                console.error("Webamp failed to load:", err);
            });
        }
    </script>
</body>
</html>
