<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webamp - Stable Large</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #001f3f; 
            overflow: hidden; 
        }
        /* No scaling here to keep performance fast */
        #app { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>
    <script src="https://unpkg.com/butterchurn@2.6.7/lib/butterchurn.min.js"></script>
    <script src="https://unpkg.com/butterchurn-presets@2.4.7/lib/butterchurnPresets.min.js"></script>

    <script>
        const Webamp = window.Webamp;

        const initialTracks = [
            {
                metaData: { artist: "Choker", title: "El Dorado" },
                url: "https://cdn.jsdelivr.net/gh/coolgamer4556/webamp-assets@main/1_05%20-%20El%20Dorado.mp3"
            },
            {
                metaData: { artist: "Jonn Hart", title: "Who Booty" },
                url: "https://cdn.jsdelivr.net/gh/coolgamer4556/webamp-assets@main/Jonn%20Hart%20%E2%80%93%20Who%20Booty.mp3"
            }
        ];

        // If the skin keeps failing, you can comment out the url line below to test
        const initialSkin = {
            url: "https://cdn.jsdelivr.net/gh/coolgamer4556/webamp-assets@main/Winamp5_Classified_v5.5.wsz"
        };

        const webamp = new Webamp({
            initialTracks: initialTracks,
            initialSkin: initialSkin,
            __butterchurnOptions: {
                importButterchurn: () => Promise.resolve(window.butterchurn),
                getPresets: () => {
                    const presets = window.butterchurnPresets.getPresets();
                    return Object.keys(presets).map((name) => {
                        return { name, butterchurnPresetObject: presets[name] };
                    });
                },
                butterchurnOpen: true 
            },
            zIndex: 99999
        });

        // This function handles all the "Size" logic once the player is ready
        webamp.onReady(() => {
            console.log("Webamp is ready, applying sizes...");

            // 1. Double the pixel size (Standard Winamp Double Mode)
            webamp.store.dispatch({ type: 'SET_DOUBLE_SIZE_MODE', doubleSizeMode: true });

            // 2. Make the Visualizer window very large
            // [Width, Height] - On the official site, it's roughly 3 or 4 blocks wide
            webamp.store.dispatch({
                type: 'UPDATE_WINDOW_PROPS',
                windowId: 'milkdrop',
                props: { size: [3, 2] } 
            });

            // 3. Move the windows so they don't overlap
            // Main Player at 0,0
            webamp.store.dispatch({
                type: 'UPDATE_WINDOW_PROPS',
                windowId: 'main',
                props: { xy: [0, 0] }
            });

            // Milkdrop right below it (116 is the height of the main player in double mode)
            webamp.store.dispatch({
                type: 'UPDATE_WINDOW_PROPS',
                windowId: 'milkdrop',
                props: { xy: [0, 116] }
            });
        });

        // Render the player
        if (!Webamp.browserIsSupported()) {
            document.getElementById("app").innerText = "Webamp is not supported";
        } else {
            webamp.renderWhenReady(document.getElementById("app"));
        }
    </script>
</body>
</html>
